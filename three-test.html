<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <title>Three.js iPhone-Test</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07111f; color: white; font-family: system-ui, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      #result { position: fixed; z-index: 2; top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); right: max(14px, env(safe-area-inset-right)); padding: 12px 14px; border-radius: 12px; background: rgb(15 23 42 / 84%); backdrop-filter: blur(10px); }
      #result[data-state="ready"] { background: rgb(20 83 45 / 84%); }
      #result[data-state="error"] { background: rgb(127 29 29 / 92%); }
    </style>
  </head>
  <body>
    <div id="result">Starte Three.js …</div>
    <script type="module" src="/src/three-test.js"></script>
  </body>
</html>
